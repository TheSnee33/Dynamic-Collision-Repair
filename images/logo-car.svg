<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <!-- Sleek sports car silhouette - red/maroon -->
  <defs>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#7f1d1d"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568"/>
      <stop offset="100%" style="stop-color:#1a202c"/>
    </linearGradient>
  </defs>
  <!-- Car body - sleek sports car -->
  <path d="M20,65 L30,65 L35,55 L55,40 L75,32 L110,30 L140,32 L160,38 L175,50 L185,58 L185,65 L180,70 L155,72 L145,72 L135,65 L75,65 L65,72 L45,72 L35,65 Z" fill="url(#carGrad)" stroke="#991b1b" stroke-width="1"/>
  <!-- Roof line / window area -->
  <path d="M60,55 L70,40 L82,34 L115,33 L135,36 L155,45 L160,55 Z" fill="url(#windowGrad)" stroke="#4a5568" stroke-width="0.5"/>
  <!-- Window divider -->
  <line x1="110" y1="33" x2="112" y2="55" stroke="#2d3748" stroke-width="1.5"/>
  <!-- Front wheel -->
  <circle cx="55" cy="68" r="14" fill="#1a1a2e" stroke="#4a5568" stroke-width="2"/>
  <circle cx="55" cy="68" r="9" fill="#2d2d44" stroke="#555" stroke-width="1"/>
  <circle cx="55" cy="68" r="3" fill="#666"/>
  <!-- Rear wheel -->
  <circle cx="150" cy="68" r="14" fill="#1a1a2e" stroke="#4a5568" stroke-width="2"/>
  <circle cx="150" cy="68" r="9" fill="#2d2d44" stroke="#555" stroke-width="1"/>
  <circle cx="150" cy="68" r="3" fill="#666"/>
  <!-- Headlight -->
  <ellipse cx="178" cy="56" rx="5" ry="3" fill="#fbbf24" opacity="0.9"/>
  <!-- Tail light -->
  <rect x="22" y="57" width="8" height="4" rx="2" fill="#ef4444" opacity="0.9"/>
  <!-- Speed lines -->
  <line x1="2" y1="45" x2="18" y2="45" stroke="#dc2626" stroke-width="1.5" opacity="0.6"/>
  <line x1="5" y1="52" x2="22" y2="52" stroke="#b91c1c" stroke-width="1" opacity="0.5"/>
  <line x1="8" y1="59" x2="20" y2="59" stroke="#991b1b" stroke-width="1" opacity="0.4"/>
</svg>
